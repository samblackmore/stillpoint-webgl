<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Stillpoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@600&display=swap" rel="stylesheet">
    <style>
      html, body {
        padding: 0; margin: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #7C8FBF;
      }
      #unity-container { position: fixed; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; background: #7C8FBF; display: block; }

      /* Drifter path loading screen */
      #loading-screen {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px;
        background: #7C8FBF;
        z-index: 10;
      }
      #loading-text {
        font-family: 'Baloo Bhaina 2', 'Baloo Bhaina', sans-serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.9);
        margin: 0;
        user-select: none;
      }
      #path-dots { display: flex; gap: 22px; align-items: center; }
      .dot {
        width: 16px; height: 16px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        transform: scale(0.65);
        transition: transform 0.3s ease, background-color 0.3s ease;
      }
      .dot.lit {
        background: #FFC700;
        transform: scale(1.25);
      }
      #unity-warning {
        position: absolute; left: 50%; top: 5%; transform: translate(-50%, 0);
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="loading-screen">
        <p id="loading-text">Loading</p>
        <div id="path-dots"></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var DOT_COUNT = 10;

      // Build the drifter path dots
      var pathDots = document.querySelector("#path-dots");
      for (var i = 0; i < DOT_COUNT; i++) {
        var dot = document.createElement("div");
        dot.className = "dot";
        pathDots.appendChild(dot);
      }
      var dots = pathDots.children;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl-muse.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/webgl-muse.data",
        frameworkUrl: buildUrl + "/webgl-muse.framework.js",
        codeUrl: buildUrl + "/webgl-muse.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Sam",
        productName: "Stillpoint",
        productVersion: "0.0.22",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Light the drifter path dots as loading progresses, ~10% each
          var litCount = Math.min(DOT_COUNT, Math.floor(progress * DOT_COUNT));
          for (var i = 0; i < DOT_COUNT; i++) {
            dots[i].classList.toggle("lit", i < litCount);
          }
        }).then((unityInstance) => {
          document.querySelector("#loading-screen").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
